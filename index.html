<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Typeface: EB Garamond.
      Copyright (c) 2017, The EB Garamond Project Authors, licensed under the
      SIL Open Font License 1.1. Licence text:
      https://openfontlicense.org
      Source: https://github.com/octaviopardo/EBGaramond12
    -->
    <title>Works on contingency? No, money down!</title>
    <link rel="stylesheet" href="./src/app.css" />
  </head>
  <body>
    <main class="stage">
      <figure class="card">
        <canvas id="card" width="960" height="720"></canvas>
        <!-- the plate is an img so the bundler inlines it as a data URI;
             loading it from JS would leave it as a separate file -->
        <img id="plate" src="./assets/card/plate.jpg" alt="" hidden />
        <img id="fingers" src="./assets/card/fingers.png" alt="" hidden />
      </figure>

      <form class="panel" id="panel" autocomplete="off">
        <label class="field">
          <input id="header" type="text" spellcheck="false" value="LIONEL HUTZ" />
        </label>

        <label class="field">
          <input id="top" type="text" spellcheck="false" value="WORKS ON CONTINGENCY?" />
        </label>

        <label class="field">
          <input id="bottom" type="text" spellcheck="false" value="NO, MONEY DOWN!" />
        </label>

        <div class="actions">
          <button type="button" id="download">Download</button>
          <button type="button" id="copy">Copy</button>
          <button type="button" id="share" hidden>Share</button>
        </div>

        <p class="hint" id="hint" role="status" aria-live="polite"></p>
      </form>
    </main>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
